<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Initializr</title>
    <style>
        body {
            background-color: #1a1e23;
            color: #d8dee4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Placeholder */
        aside {
            width: 80px;
            background-color: #1f2428;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        .aside-icon {
            width: 32px;
            height: 32px;
            background-color: #d8dee4;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            padding: 24px 40px;
            border-bottom: 1px solid #30363d;
        }
        .logo {
            display: flex;
            align-items: center;
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #6db33f;
            margin-right: 8px;
        }
        .theme-toggle {
            margin-left: auto;
            background: #ffffff;
            border-radius: 4px;
            color: #24292e;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        /* Content Flexbox */
        .content {
            display: flex;
            padding: 30px 40px;
            flex: 1;
        }

        /* Left Column */
        .col-left {
            flex: 1;
            padding-right: 40px;
            border-right: 1px solid #30363d;
        }

        /* Right Column */
        .col-right {
            flex: 1;
            padding-left: 40px;
        }

        /* Form Groups */
        .form-section {
            margin-bottom: 24px;
        }
        .row {
            display: flex;
            gap: 40px;
            margin-bottom: 24px;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }
        
        .radio-group {
            display: flex;
            gap: 16px;
            font-size: 13px;
        }

        label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        input[type="radio"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #6e7681;
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
        }
        input[type="radio"]:checked {
            border-color: #6db33f;
        }
        input[type="radio"]:checked::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 6px;
            height: 6px;
            background-color: #6db33f;
            border-radius: 50%;
        }
        input[type="radio"]:checked + span {
            color: #6db33f;
        }

        /* Spring Boot Grid */
        .version-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            font-size: 13px;
        }

        /* Inputs */
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .input-label {
            width: 100px;
            color: #8b949e;
            text-align: right;
            padding-right: 16px;
        }
        input[type="text"] {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #30363d;
            color: #d8dee4;
            padding: 8px 4px;
            flex: 1;
            font-family: monospace;
            font-size: 13px;
        }
        input[type="text"]:focus {
            outline: none;
            border-bottom-color: #6db33f;
        }

        /* Dependencies Section */
        .dep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .btn-add {
            background: transparent;
            border: 1px solid #d8dee4;
            color: #d8dee4;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add span {
            color: #8b949e;
            margin-left: 8px;
        }
        .empty-state {
            font-style: italic;
            color: #8b949e;
            font-size: 13px;
        }

        /* Footer */
        footer {
            background-color: #1f2428;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #30363d;
        }
        .btn-primary {
            background: transparent;
            border: 2px solid #d8dee4;
            color: #d8dee4;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #d8dee4;
            color: #1f2428;
        }
        .btn-primary span {
            color: #8b949e;
            font-weight: 400;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <aside>
        <div style="width: 24px; height: 3px; background: #d8dee4; margin-bottom: 6px;"></div>
        <div style="width: 24px; height: 3px; background: #d8dee4; margin-bottom: 6px;"></div>
        <div style="width: 24px; height: 3px; background: #d8dee4; margin-bottom: 24px;"></div>
        <div style="font-size: 24px; color:#8b949e; margin-bottom: 20px;">↺</div>
    </aside>

    <main>
        <header>
            <div class="logo">
                <span style="font-size: 32px;">⚇</span> spring <span style="font-weight:400; color:#fff;">initializr</span>
            </div>
            <div class="theme-toggle">
                <span style="font-size:12px;">☼</span>
                <span style="font-size:12px;">☽</span>
            </div>
        </header>

        <div class="content">
            <div class="col-left">
                <div class="row">
                    <div class="form-section">
                        <div class="title">Project</div>
                        <div class="radio-group" style="flex-direction: column;">
                            <div style="display:flex; gap:16px;">
                                <label><input type="radio" name="project"> <span>Gradle - Groovy</span></label>
                                <label><input type="radio" name="project"> <span>Gradle - Kotlin</span></label>
                            </div>
                            <label><input type="radio" name="project" checked> <span>Maven</span></label>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="title">Language</div>
                        <div class="radio-group">
                            <label><input type="radio" name="lang" checked> <span>Java</span></label>
                            <label><input type="radio" name="lang"> <span>Kotlin</span></label>
                            <label><input type="radio" name="lang"> <span>Groovy</span></label>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="title">Spring Boot</div>
                    <div class="version-grid">
                        <label><input type="radio" name="boot"> <span>4.1.0 (SNAPSHOT)</span></label>
                        <label><input type="radio" name="boot"> <span>4.1.0 (RC1)</span></label>
                        <label><input type="radio" name="boot"> <span>4.0.7 (SNAPSHOT)</span></label>
                        <label><input type="radio" name="boot" checked> <span>4.0.6</span></label>
                        <label><input type="radio" name="boot"> <span>3.5.15 (SNAPSHOT)</span></label>
                        <label><input type="radio" name="boot"> <span>3.5.14</span></label>
                    </div>
                </div>

                <div class="form-section" style="margin-top: 32px;">
                    <div class="title">Project Metadata</div>
                    
                    <div class="input-group">
                        <div class="input-label">Group</div>
                        <input type="text" value="com.example">
                    </div>
                    <div class="input-group">
                        <div class="input-label">Artifact</div>
                        <input type="text" value="demo">
                    </div>
                    <div class="input-group">
                        <div class="input-label">Package name</div>
                        <input type="text" value="com.example.demo">
                    </div>

                    <div style="display: flex; gap: 40px; margin-top: 24px;">
                        <div class="input-group">
                            <div class="input-label">Packaging</div>
                            <div class="radio-group">
                                <label><input type="radio" name="pkg" checked> <span>Jar</span></label>
                                <label><input type="radio" name="pkg"> <span>War</span></label>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 40px; margin-top: 12px;">
                        <div class="input-group">
                            <div class="input-label">Configuration</div>
                            <div class="radio-group">
                                <label><input type="radio" name="config" checked> <span>Properties</span></label>
                                <label><input type="radio" name="config"> <span>YAML</span></label>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; margin-top: 12px;">
                        <div class="input-group">
                            <div class="input-label">Java</div>
                            <div class="radio-group">
                                <label><input type="radio" name="java"> <span>26</span></label>
                                <label><input type="radio" name="java"> <span>25</span></label>
                                <label><input type="radio" name="java"> <span>21</span></label>
                                <label><input type="radio" name="java" checked> <span>17</span></label>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-right">
                <div class="dep-header">
                    <div class="title" style="margin:0;">Dependencies</div>
                    <button class="btn-add">ADD DEPENDENCIES... <span>CTRL + B</span></button>
                </div>
                <div class="empty-state">No dependency selected</div>
            </div>
        </div>

        <footer>
            <button class="btn-primary">GENERATE <span>CTRL + ↵</span></button>
            <button class="btn-primary">EXPLORE <span>CTRL + SPACE</span></button>
            <button class="btn-primary" style="padding: 10px 16px;">...</button>
        </footer>
    </main>

</body>
</html>
